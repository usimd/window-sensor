name: Test and build
on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf
          components: clippy, rustfmt, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware

      - name: Install just
        run: cargo install just cargo-binutils cargo-llvm-cov --locked --quiet

      - name: Lint, test, build
        run: just ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

      - name: Binary size
        run: just size | tee /tmp/size.txt

      - name: Sign firmware image
        env:
          MCUBOOT_SIGNING_KEY: ${{ secrets.MCUBOOT_SIGNING_KEY }}
        run: |
          pip install --quiet imgtool

          # Decode signing key to the path just expects
          mkdir -p firmware/keys
          if [[ -n "${MCUBOOT_SIGNING_KEY:-}" ]]; then
            echo "$MCUBOOT_SIGNING_KEY" | base64 -d > firmware/keys/signing-key.pem
          else
            echo "::warning::No signing key — generating ephemeral dev key"
            imgtool keygen -k firmware/keys/signing-key.pem -t ed25519
          fi

          just version="0.1.0+$(git rev-list --count HEAD)" sign
          just version="0.1.0+$(git rev-list --count HEAD)" sign-hex
          rm -f firmware/keys/signing-key.pem

      - name: Upload firmware ELF
        uses: actions/upload-artifact@v7
        with:
          name: firmware-elf
          path: firmware/target/thumbv8m.main-none-eabihf/release/window-sensor

      - name: Upload partition manifest
        uses: actions/upload-artifact@v7
        with:
          name: firmware-partition-manifest
          path: firmware/target/thumbv8m.main-none-eabihf/release/partition_manifest.json

      - name: Upload size report
        uses: actions/upload-artifact@v7
        with:
          name: firmware-size
          path: /tmp/size.txt

      - name: Upload OTA image
        uses: actions/upload-artifact@v7
        with:
          name: firmware-ota
          path: firmware/target/thumbv8m.main-none-eabihf/release/window-sensor-ota.bin

      - name: Upload signed HEX
        uses: actions/upload-artifact@v7
        with:
          name: firmware-signed-hex
          path: firmware/target/thumbv8m.main-none-eabihf/release/window-sensor-signed.hex

  kicad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Pull KiCad image
        run: docker pull kicad/kicad:10.0

      - name: Prepare workspace for KiCad container
        run: chmod a+w .

      - name: ERC (Electrical Rules Check)
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" -w /work \
            kicad/kicad:10.0 kicad-cli sch erc --exit-code-violations window-sensor.kicad_sch

      - name: DRC (Design Rules Check)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" -w /work \
            kicad/kicad:10.0 kicad-cli pcb drc --exit-code-violations window-sensor.kicad_pcb

      - name: Export schematic PDF
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" -w /work \
            kicad/kicad:10.0 kicad-cli sch export pdf -o sch.pdf window-sensor.kicad_sch

      - name: Export BOM
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" -w /work \
            kicad/kicad:10.0 kicad-cli sch export bom -o bom.csv window-sensor.kicad_sch

      - name: Export Gerbers
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" -w /work \
            kicad/kicad:10.0 sh -c "mkdir -p gbr && kicad-cli pcb export gerbers -o gbr/ window-sensor.kicad_pcb && kicad-cli pcb export drill -o gbr/ window-sensor.kicad_pcb"

      - name: Upload PCB artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pcb
          path: |
            sch.pdf
            bom.csv
            gbr/

      - name: Upload ERC/DRC reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pcb-reports
          path: "*.rpt"
