# nRF54L10 target for probe-rs (no upstream variant as of probe-rs 0.32).
# Derived from probe-rs 0.32 targets/nRF54L_Series.yaml: same flash algorithm,
# memory sizes from Zephyr dts/vendor/nordic/nrf54l10.dtsi (RRAM 1012 KiB, SRAM 192 KiB).

name: nRF54L10 Series
manufacturer:
  id: 0x44
  cc: 0x2
variants:
- name: nRF54L10
  cores:
  - name: main
    type: armv8m
    core_access_options: !Arm
      ap: !v1 0
  memory_map:
  - !Nvm
    range:
      start: 0x0
      end: 0xfd000
    cores:
    - main
    access:
      boot: true
  - !Ram
    range:
      start: 0x20000000
      end: 0x20030000
    cores:
    - main
  flash_algorithms:
  - nRF54L10
flash_algorithms:
- name: nRF54L10
  description: nrf54l flash algorithm
  default: true
  instructions: 
  load_address: 0x20000020
  pc_init: 0x1
  pc_uninit: 0x2f
  pc_program_page: 0x61
  pc_erase_sector: 0x51
  pc_erase_all: 0xb7
  data_section_offset: 0x200001b4
  flash_properties:
    address_range:
      start: 0x0
      end: 0xfd000
    page_size: 0x1000
    erased_byte_value: 0xff
    program_page_timeout: 1000
    erase_sector_timeout: 2000
    sectors:
    - size: 0x1000
      address: 0x0
  cores:
  - main
