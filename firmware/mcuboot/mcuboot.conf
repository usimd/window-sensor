# MCUboot Kconfig overlay for window-sensor (nRF54L10)
# ed25519 signature verification, swap-using-scratch upgrade strategy

# Signature type
CONFIG_BOOT_SIGNATURE_TYPE_ED25519=y
CONFIG_BOOT_SIGNATURE_TYPE_RSA=n
CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=n

# Upgrade strategy: swap with scratch area for rollback safety
CONFIG_BOOT_SWAP_USING_SCRATCH=y
CONFIG_BOOT_UPGRADE_ONLY=n

# Validate primary slot on every boot (security)
CONFIG_BOOT_VALIDATE_SLOT0=y

# Image header size (must match imgtool --header-size)
CONFIG_PM_PARTITION_SIZE_MCUBOOT=0x10000

# Serial recovery over UART (useful for first-flash debugging)
CONFIG_MCUBOOT_SERIAL=n
CONFIG_BOOT_SERIAL_UART=n

# Logging (disable in production for smaller binary)
CONFIG_MCUBOOT_LOG_LEVEL_WRN=y
CONFIG_LOG=y

# Flash driver
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# Reduce bootloader size
CONFIG_BOOT_BANNER=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=n
